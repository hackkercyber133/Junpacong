workflows:
  junpacong-android:
    name: junpacong Android
    max_build_duration: 30
    instance_type: linux_x2
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Siapkan project Android
        script: |
          bash setup.sh
      - name: Build APK release
        script: |
          flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
